[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-learning-texture-bias"
version = "0.1.0"
description = "Exploratory CIFAR-10 texture and edge dual-branch CNN"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.6", "Pillow>=9.0", "torch>=2.0", "torchvision>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]
